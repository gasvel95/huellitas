<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Política de privacidad de Huellitas, aplicación comunitaria para publicar mascotas perdidas o encontradas.">
  <meta name="theme-color" content="#20352f">
  <title>Política de privacidad | Huellitas</title>
  <style>
    :root {
      --ink: #20352f;
      --teal: #287b6a;
      --mint: #dff1ea;
      --cream: #fff9f1;
      --orange: #ee6a3b;
      --orange-soft: #ffe3d6;
      --muted: #687b76;
      --line: #d8e2dd;
      --white: #fff;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 6%, rgba(238, 106, 59, .12), transparent 24rem),
        radial-gradient(circle at 92% 22%, rgba(40, 123, 106, .12), transparent 30rem),
        var(--cream);
      line-height: 1.65;
    }

    a { color: var(--teal); text-underline-offset: .18em; }
    a:hover { color: var(--orange); }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 4.5rem 1.25rem 5.5rem;
      color: var(--white);
      background: linear-gradient(135deg, #20352f 0%, #145f52 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 34rem;
      height: 12rem;
      right: -8rem;
      bottom: -8rem;
      border: 2.5rem solid var(--orange);
      border-radius: 50%;
      transform: rotate(-12deg);
      opacity: .92;
    }

    .hero-inner,
    .layout,
    footer {
      width: min(1120px, 100%);
      margin-inline: auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: 2.5rem;
      font-weight: 800;
      letter-spacing: .01em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 3rem;
      height: 3rem;
      color: var(--orange);
      background: var(--white);
      border-radius: 50%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
      font-size: 1.4rem;
    }

    h1 {
      max-width: 780px;
      margin: 0;
      font-size: clamp(2.6rem, 7vw, 5.4rem);
      line-height: .98;
      letter-spacing: -.055em;
    }
